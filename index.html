<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>K–6 Maths Curriculum — Worksheet Generator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="app-header no-print">
    <h1>K–6 Maths Curriculum</h1>
    <button class="btn-print" id="btn-print" disabled>Print Worksheet</button>
  </header>

  <div class="app-layout">

    <!-- Sidebar -->
    <aside class="sidebar no-print">
      <nav class="year-tabs" id="year-tabs" role="tablist"></nav>

      <div class="sidebar-body">
        <ul class="topic-list" id="topic-list"></ul>

        <div class="sidebar-controls" id="sidebar-controls" style="display:none">
          <label class="count-label" for="count-input">
            Problems
            <input type="number" id="count-input" min="1" max="60" value="20" />
          </label>
          <div class="difficulty-row">
            <span class="difficulty-label">Difficulty</span>
            <div class="difficulty-btns" id="difficulty-btns">
              <button class="diff-btn active" data-level="1">Easy</button>
              <button class="diff-btn" data-level="2">Medium</button>
              <button class="diff-btn" data-level="3">Hard</button>
              <button class="diff-btn" data-level="4">Harder</button>
              <button class="diff-btn" data-level="5">Hardest</button>
            </div>
          </div>
          <button class="btn-generate" id="btn-generate">Generate Worksheet</button>
          <p class="error-msg" id="error-msg"></p>
        </div>
      </div>
    </aside>

    <!-- Worksheet -->
    <main class="worksheet-area">
      <div class="worksheet empty" id="worksheet">
        Select a topic from the sidebar to generate a worksheet.
      </div>
    </main>

  </div>

  <script src="curriculum.js"></script>
  <script src="generators.js"></script>
  <script src="app.js"></script>
</body>
</html>
