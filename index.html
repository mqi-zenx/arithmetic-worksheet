<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>K–6 Maths Curriculum — Worksheet Generator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="app-header no-print">
    <h1>K–6 Maths Curriculum</h1>
    <div class="header-actions">
      <button class="btn-answers" id="btn-answers" disabled>Show Answers</button>
      <button class="btn-print-key" id="btn-print-key" disabled>Print Answer Key</button>
      <button class="btn-print" id="btn-print" disabled>Print Worksheet</button>
    </div>
  </header>

  <div class="app-layout">

    <!-- Sidebar -->
    <aside class="sidebar no-print">
      <nav class="year-tabs" id="year-tabs" role="tablist"></nav>

      <div class="sidebar-body">
        <div class="topic-search-wrap">
          <input type="search" id="topic-search" placeholder="Search topics…" autocomplete="off" aria-label="Search topics" />
        </div>
        <ul class="topic-list" id="topic-list" aria-label="Topics"></ul>

        <div class="sidebar-controls" id="sidebar-controls" style="display:none">
          <label class="count-label" for="count-input">
            Problems
            <input type="number" id="count-input" min="1" max="60" value="20" />
          </label>
          <div class="difficulty-row" id="difficulty-row">
            <span class="difficulty-label" id="difficulty-label">Difficulty</span>
            <div class="difficulty-btns" id="difficulty-btns" role="group" aria-labelledby="difficulty-label">
              <button type="button" class="diff-btn active" data-level="1" aria-pressed="true">Easy</button>
              <button type="button" class="diff-btn" data-level="2" aria-pressed="false">Medium</button>
              <button type="button" class="diff-btn" data-level="3" aria-pressed="false">Hard</button>
              <button type="button" class="diff-btn" data-level="4" aria-pressed="false">Harder</button>
              <button type="button" class="diff-btn" data-level="5" aria-pressed="false">Hardest</button>
            </div>
          </div>
          <button type="button" class="btn-generate" id="btn-generate">Generate Worksheet</button>
          <p class="error-msg" id="error-msg" role="alert"></p>

          <details class="print-settings" id="print-settings" style="display:none">
            <summary class="print-settings-toggle">Print settings</summary>
            <div class="print-settings-body">
              <label class="ps-label">
                <span>Columns</span>
                <select id="print-cols">
                  <option value="auto">Auto</option>
                  <option value="2">2 columns</option>
                  <option value="3">3 columns</option>
                  <option value="4">4 columns</option>
                </select>
              </label>
              <label class="ps-label">
                <span>Size</span>
                <select id="print-size">
                  <option value="normal">Normal</option>
                  <option value="compact">Compact (more per page)</option>
                  <option value="large">Large (easier to read)</option>
                </select>
              </label>
            </div>
          </details>
        </div>
      </div>
    </aside>

    <!-- Worksheet -->
    <main class="worksheet-area">
      <div class="worksheet empty" id="worksheet">
        Select a topic from the sidebar to generate a worksheet.
      </div>
    </main>

  </div>

  <script src="curriculum.js"></script>
  <script src="generators.js"></script>
  <script src="app.js"></script>
</body>
</html>
